name: Feature request
description: Propose an addition to a CORA package
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes: { label: "Problem", description: "What can't you do today?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: "Proposed solution" }
    validations: { required: true }
  - type: markdown
    attributes:
      value: "Large API/design changes should be an RFC instead - see docs/rfcs/README.md."

name: Bug report
description: Something in a CORA package misbehaves
labels: [bug, triage]
body:
  - type: input
    id: package
    attributes: { label: "Package", placeholder: "@cora/lib" }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: "Version", placeholder: "0.1.0" }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: "Minimal reproduction", description: "Smallest code/steps that show the bug" }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: "Expected vs actual behavior" }
    validations: { required: true }
